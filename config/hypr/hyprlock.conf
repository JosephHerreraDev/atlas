$font = FiraCode Nerd Font
$text = rgba(205, 214, 244, 1.0)
$muted = rgba(166, 173, 200, 1.0)
$surface = rgba(17, 17, 27, 0.55)
$border = rgba(205, 214, 244, 0.22)
$accent = rgba(137, 180, 250, 1.0)
$error = rgba(243, 139, 168, 1.0)

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

# Time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = $font
    font_size = 112
    position = 0, 185
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_family = $font
    font_size = 20
    position = 0, 95
    halign = center
    valign = center
}

# Password prompt
input-field {
    monitor =
    size = 310, 50
    position = 0, -55
    halign = center
    valign = center

    font_family = $font
    font_color = $text
    inner_color = $surface
    outer_color = $border
    check_color = $accent
    fail_color = $error
    capslock_color = rgba(249, 226, 175, 1.0)
    outline_thickness = 2
    rounding = 10

    placeholder_text = <span foreground="##a6adc8">Enter password</span>
    fail_text = <span foreground="##f38ba8">Authentication failed ($ATTEMPTS)</span>
    fade_on_empty = false
    hide_input = false
    dots_center = true
    dots_size = 0.18
    dots_spacing = 0.35
}
