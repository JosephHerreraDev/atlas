# Managed by Atlas Settings. Timeout metadata is kept here so the settings
# backend can safely round-trip disabled listeners.
# atlas-lock-timeout = 300
# atlas-display-timeout = 600
# atlas-suspend-timeout = 1800

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
